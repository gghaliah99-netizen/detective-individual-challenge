<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detective Evidence Challenge | Individual</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:radial-gradient(circle at 70% 0%,#26496b,#07152b 55%);color:#fff;min-height:100vh}.wrap{max-width:850px;margin:auto;padding:24px 18px 60px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.tag{border:1px solid #cda85e;border-radius:12px;padding:10px 14px;color:#ffe2a2;font-weight:bold}.air{background:#b92135;padding:10px 15px;border-radius:9px;font-weight:bold;letter-spacing:2px}h1{font-size:clamp(30px,6vw,54px);margin:26px 0 8px}h1 span{color:#f6c96c}.sub{color:#d6e1ef;font-size:18px;line-height:1.5}.panel{background:#f9f6ef;color:#07152b;border-radius:18px;padding:clamp(18px,4vw,32px);margin-top:24px;box-shadow:0 12px 35px #0006}.progress{font-weight:bold;color:#9c2634}.question{font-size:clamp(22px,4vw,31px);font-weight:800;line-height:1.4;margin:18px 0 26px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{border:3px solid #c6d1df;background:white;color:#0a1d38;border-radius:14px;padding:19px;font-size:22px;font-weight:bold;cursor:pointer}.choice[aria-pressed=true]{border-color:#c79129;background:#fff1ca}.buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}button.action{border:0;border-radius:12px;padding:15px 24px;background:#bb2339;color:white;font-size:17px;font-weight:bold;cursor:pointer}button.action:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#163b64!important}.hint{font-size:15px;color:#526276;margin-top:20px}.result{font-size:22px;line-height:1.6}.score{font-size:50px;font-weight:900;color:#a72838}.review{padding:14px 0;border-top:1px solid #d4d7dc;line-height:1.5}.review b{color:#0a3159}.footer{margin-top:22px;color:#bfcbd9;font-size:13px;text-align:center}@media(max-width:500px){.choices{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div class="tag">MEGA GOAL 3 · UNIT 4 · THE WORLD OF TV</div><div class="air">● ON AIR</div></div><h1>🔎 Detective <span>Evidence Challenge</span></h1><div class="sub">Individual Mission · Read, Decide & Correct<br>Choose True or False for each statement. Check your result at the end.</div><main id="app" class="panel" aria-live="polite"></main><div class="footer">Teacher: Ghaliah Al-Shamrani | Reading + Speaking</div></div><script>const data=[{q:'Detective stories are only popular on TV.',a:false,why:'Detective stories have long been popular in literature and are also popular in TV films and series.'},{q:'Their success comes from several elements.',a:true,why:'Their appeal comes from the hero, mystery, action, gadgets and suspense.'},{q:'Many story elements are predictable.',a:true,why:'Repeated characters and events make them formula stories.'},{q:'All detectives are intelligent and charming.',a:false,why:'Some detectives are gruff and serious; comedy detectives may be naive and clumsy.'},{q:'The formula is likely to change significantly.',a:false,why:'The familiar formula tends to remain recognizable, with recurring elements.'}];let n=0,selected=null,answers=[];const app=document.getElementById('app');function show(){selected=answers[n]??null;app.innerHTML=`<div class="progress">CASE ${n+1} OF ${data.length}</div><div class="question">${data[n].q}</div><div class="choices"><button class="choice" data-v="true" aria-pressed="${selected===true}">✓ True</button><button class="choice" data-v="false" aria-pressed="${selected===false}">✕ False</button></div><div class="buttons"><button class="action secondary" id="back" ${n===0?'disabled':''}>Previous</button><button class="action" id="next" ${selected===null?'disabled':''}>${n===data.length-1?'Submit Answers':'Next Question →'}</button></div><p class="hint">Tip: Find evidence in the reading text before choosing.</p>`;app.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{selected=b.dataset.v==='true';answers[n]=selected;show()});app.querySelector('#back').onclick=()=>{n--;show()};app.querySelector('#next').onclick=()=>{if(n<data.length-1){n++;show()}else result()}}function result(){const score=data.filter((x,i)=>x.a===answers[i]).length;app.innerHTML=`<div class="progress">CASE CLOSED · YOUR RESULTS</div><div class="score">${score} / ${data.length}</div><p class="result">${score===5?'Excellent detective work!':'Good investigation! Review the evidence below.'}</p><div id="reviews"></div><div class="buttons"><button class="action" id="retry">Try Again</button><button class="action secondary" id="print">Print Results</button></div><p class="hint">Results stay on this device. They are not automatically sent to the teacher.</p>`;app.querySelector('#reviews').innerHTML=data.map((x,i)=>`<div class="review"><b>${i+1}. ${x.q}</b><div>Your answer: ${answers[i]?'True':'False'} · Correct: ${x.a?'True':'False'} ${answers[i]===x.a?'✓':'✕'}</div><div>${x.why}</div></div>`).join('');app.querySelector('#retry').onclick=()=>{n=0;answers=[];show()};app.querySelector('#print').onclick=()=>window.print()}show();</script></body></html>

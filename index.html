<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Detective Evidence Challenge | Individual</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:radial-gradient(circle at 70% 0%,#2b4e73,#07152b 60%);color:#fff;min-height:100vh}.wrap{max-width:860px;margin:auto;padding:24px 18px 48px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.tag{border:1px solid #cda85e;border-radius:12px;padding:10px 14px;color:#ffe2a2;font-weight:bold}.air{background:#b92135;padding:10px 15px;border-radius:9px;font-weight:bold;letter-spacing:2px}h1{font-size:clamp(29px,6vw,52px);margin:26px 0 8px}h1 span{color:#f6c96c}.sub{color:#d6e1ef;font-size:18px;line-height:1.5}.panel{background:#f9f6ef;color:#07152b;border-radius:18px;padding:clamp(18px,4vw,32px);margin-top:24px;box-shadow:0 12px 35px #0006}.progress{font-weight:bold;color:#9c2634}.bar{height:9px;border-radius:12px;background:#d8e0e8;overflow:hidden;margin:12px 0 20px}.fill{height:100%;background:#bb2339;transition:width .2s}.question{font-size:clamp(22px,4vw,31px);font-weight:800;line-height:1.4;margin:18px 0 26px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{border:3px solid #c6d1df;background:white;color:#0a1d38;border-radius:14px;padding:19px;font-size:22px;font-weight:bold;cursor:pointer}.choice[aria-pressed=true]{border-color:#c79129;background:#fff1ca}.buttons{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.action{border:0;border-radius:12px;padding:16px 25px;background:#bb2339;color:white;font-size:18px;font-weight:bold;cursor:pointer}.action:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#163b64}.hint{font-size:15px;color:#526276;margin-top:20px}.result{font-size:21px;line-height:1.6}.score{font-size:clamp(52px,10vw,84px);font-weight:900;color:#a72838}.review{padding:15px 0;border-top:1px solid #d4d7dc;line-height:1.6}.review b{color:#0a3159}.correct{color:#126a37;font-weight:bold}.incorrect{color:#a72838;font-weight:bold}.footer{margin-top:22px;color:#bfcbd9;font-size:13px;text-align:center}@media(max-width:500px){.choices{grid-template-columns:1fr}.action{width:100%}}@media print{body{background:#fff;color:#000}.panel{box-shadow:none}.buttons,.top,.sub,.footer,.hint{display:none}}
</style></head><body><div class="wrap"><div class="top"><div class="tag">MEGA GOAL 3 · UNIT 4 · THE WORLD OF TV</div><div class="air">● ON AIR</div></div><h1>🔎 Detective <span>Evidence Challenge</span></h1><div class="sub">Individual Mission · Read, Decide & Correct<br>Answer all five True or False questions, then see your score.</div><main id="app" class="panel" aria-live="polite"></main><div class="footer">Teacher: Ghaliah Al-Shamrani | Reading + Speaking</div></div><script>
'use strict';
const questions=[
{q:'Detective stories are only popular on TV.',correct:false,explanation:'Detective stories are popular in literature as well as on television.'},
{q:'Their success comes from several elements.',correct:true,explanation:'The stories combine mystery, characters, action, clues and suspense.'},
{q:'Many story elements are predictable.',correct:true,explanation:'The same basic story formula is repeated.'},
{q:'All detectives are intelligent and charming.',correct:false,explanation:'Some detectives are serious and gruff; comedy detectives can be naive or clumsy.'},
{q:'The formula is likely to change significantly.',correct:false,explanation:'The familiar detective-story formula is expected to remain largely the same.'}
];
let current=0;const responses=Array(questions.length).fill(null);const app=document.getElementById('app');
function el(tag,cls,txt){const node=document.createElement(tag);if(cls)node.className=cls;if(txt!==undefined)node.textContent=txt;return node;}
function button(label,cls,fn,disabled=false){const b=el('button',cls,label);b.type='button';b.disabled=disabled;b.addEventListener('click',fn);return b;}
function renderQuestion(){app.replaceChildren();app.append(el('div','progress',`QUESTION ${current+1} OF ${questions.length}`));const bar=el('div','bar');const fill=el('div','fill');fill.style.width=`${(current+1)/questions.length*100}%`;bar.append(fill);app.append(bar,el('div','question',questions[current].q));const choices=el('div','choices');[true,false].forEach(value=>{const b=button(value?'✓ True':'✕ False','choice',()=>{responses[current]=value;renderQuestion()});b.setAttribute('aria-pressed',String(responses[current]===value));choices.append(b)});app.append(choices);const nav=el('div','buttons');nav.append(button('← Previous','action secondary',()=>{current--;renderQuestion()},current===0));nav.append(button(current===questions.length-1?'✓ Submit & See My Score':'Next Question →','action',()=>{if(current===questions.length-1)renderResults();else{current++;renderQuestion()}},responses[current]===null));app.append(nav,el('p','hint','Find evidence in the reading text before choosing. On question 5, tap “Submit & See My Score”.'));}
function renderResults(){if(responses.some(v=>v===null)){current=responses.findIndex(v=>v===null);renderQuestion();return}const score=questions.reduce((s,q,i)=>s+(responses[i]===q.correct?1:0),0);app.replaceChildren();app.append(el('div','progress','CASE CLOSED · YOUR RESULT'),el('div','score',`${score} / 5`),el('p','result',score===5?'Excellent! All five answers are correct.':'Your answers have been checked. Review the evidence below.'));questions.forEach((q,i)=>{const section=el('div','review');section.append(el('b','',`${i+1}. ${q.q}`),el('div',responses[i]===q.correct?'correct':'incorrect',`${responses[i]===q.correct?'✓ Correct':'✕ Incorrect'} · Your answer: ${responses[i]?'True':'False'} · Correct answer: ${q.correct?'True':'False'}`),el('div','',q.explanation));app.append(section)});const nav=el('div','buttons');nav.append(button('↻ Try Again','action',()=>{responses.fill(null);current=0;renderQuestion()}),button('Print / Save Result','action secondary',()=>window.print()));app.append(nav,el('p','hint','The score appears on your device only; it is not automatically sent to your teacher.'));window.scrollTo({top:0,behavior:'smooth'});}
renderQuestion();
</script></body></html>
